<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Our Budget</title>
<link rel="stylesheet" href="style.css">

<!-- Firebase SDK (CDN, ES-module). Exposed on window.FB for app.js. -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import {
    getAuth, GoogleAuthProvider, signInWithPopup,
    signInWithEmailAndPassword, createUserWithEmailAndPassword,
    signOut, onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import {
    getFirestore, collection, doc, onSnapshot, addDoc, updateDoc,
    deleteDoc, setDoc, getDoc, getDocs, query, where, orderBy, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  /* Firebase project config (safe to expose — this is a public client key). */
  const firebaseConfig = {

    apiKey: "AIzaSyAP-3bO3N2IRgvY7IAFdI7L-PcQvSZQL6I",

    authDomain: "expense-tracker-385ea.firebaseapp.com",

    projectId: "expense-tracker-385ea",

    storageBucket: "expense-tracker-385ea.firebasestorage.app",

    messagingSenderId: "706781764931",

    appId: "1:706781764931:web:582daccaf37ab0cde863f6"

  };


  const app  = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db   = getFirestore(app);

  /* Expose everything app.js needs. */
  window.FB = {
    app, auth, db,
    GoogleAuthProvider, signInWithPopup,
    signInWithEmailAndPassword, createUserWithEmailAndPassword,
    signOut, onAuthStateChanged,
    collection, doc, onSnapshot, addDoc, updateDoc, deleteDoc,
    setDoc, getDoc, getDocs, query, where, orderBy, serverTimestamp
  };

  /* Load app.js after Firebase is ready. */
  import('./app.js');
</script>
</head>
<body>

<div id="app">

  <!-- Loading overlay — hidden once auth state is known -->
  <div id="loading" class="loading-overlay">
    <div class="spinner"></div>
    <div class="loading-text">Loading…</div>
  </div>

  <!-- Login screen — shown only when signed out -->
  <div id="login-screen" class="login-screen" hidden>
    <div class="login-card">
      <div class="login-logo">💰</div>
      <h1 class="login-title">Our Budget</h1>
      <p class="login-sub">A shared budget for us.</p>

      <input id="login-email" class="login-input" type="email"
             placeholder="Email" autocomplete="email" autocapitalize="none">
      <input id="login-password" class="login-input" type="password"
             placeholder="Password (min 6 chars)" autocomplete="current-password">

      <div id="login-error" class="login-error"></div>

      <button id="login-btn" class="login-primary">Sign in</button>
      <button id="signup-btn" class="login-secondary">Create account</button>

      <div class="login-divider">or</div>

      <button id="google-signin" class="google-btn">
        <svg width="18" height="18" viewBox="0 0 18 18" style="margin-right:8px;vertical-align:middle">
          <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.49h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.56 2.7-3.87 2.7-6.63z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.96v2.34A9 9 0 0 0 9 18z"/>
          <path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.68 9c0-.59.1-1.16.27-1.7V4.96H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.04l2.99-2.34z"/>
          <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.34l2.58-2.58C13.46.9 11.42 0 9 0A9 9 0 0 0 .96 4.96l2.99 2.34C4.66 5.17 6.65 3.58 9 3.58z"/>
        </svg>
        Sign in with Google
      </button>

      <p class="login-hint">
        Each of you creates their own account here.<br>
        Everyone lands on the same shared budget.
      </p>
    </div>
  </div>

  <!-- Tab screens — only one visible at a time -->
  <div id="screens"></div>

  <!-- Bottom tab bar -->
  <nav id="tabbar" class="tabbar" aria-label="Main navigation"></nav>

  <!-- Floating toast -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Modal sheet root -->
  <div id="sheet-root"></div>

</div>

</body>
</html>
